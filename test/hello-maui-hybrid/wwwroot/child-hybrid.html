<!DOCTYPE html>
<!--
  MULTIWINDOW-L3 tail: child-window HybridWebView page (wwwroot/child-hybrid.html).

  Served by the subwindow page's asset bridge from the extracted payload on the MAUI hybrid
  origin (https://0.0.1/) after OpenHarmonyHybridWebViewHandler registers this child slot with
  the shell. The document loads the stock _framework/hybridwebview.js (so the bridge proof is
  "the framework script itself ran"), then:

    * records api/framework/origin/document-id into #probe (the shell stamps window.__ohHybridId
      from the registration),
    * sends one __hwvSendMessage raw message (window.HybridWebView.SendRawMessage ->
      https://0.0.1/__hwvSendMessage -> the shell forward -> RawMessageReceived on the managed
      handler of this window),
    * awaits one __hwvInvokeDotNet call (window.HybridWebView.InvokeDotNet('Echo', ...) ->
      https://0.0.1/__hwvInvokeDotNet -> the child-tagged request id bit 30 -> this window's
      handler -> the EchoInvoker result "CH<ordinal>-echo:Echo:1") and records it into #result,
    * flips document.title to CHILD-HYBRID-INVOKED (or CHILD-HYBRID-ERROR), which the managed
      Navigated probe reads back through the child eval sink.

  Host -> page direction: the managed probe calls HybridWebView.SendRawMessage once the page is
  stamped; the shell's window.external.receiveMessage shim dispatches the message as the
  HybridWebViewMessageReceived event recorded into #hostmsg.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHILD-HYBRID</title>
<style>
  html, body { min-height: 100%; }
  body { font-family: system-ui, sans-serif; margin: 10px; font-size: 15px; background: #e4f5e4; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 4px 0; }
  #probe, #result, #hostmsg { font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>child hybrid page</h1>
<p id="probe">boot</p>
<p id="result">invoke-pending</p>
<p id="hostmsg">host-pending</p>
<script src="_framework/hybridwebview.js"></script>
<script>
(async function () {
  const probe = document.getElementById('probe');
  const result = document.getElementById('result');
  const hostmsg = document.getElementById('hostmsg');
  window.addEventListener('HybridWebViewMessageReceived', function (event) {
    try {
      const message = event && event.detail ? event.detail.message : '';
      hostmsg.textContent = 'host-received:' + (message || 'empty');
    } catch (listenError) {
      hostmsg.textContent = 'host-listen-error';
    }
  });
  const api = (window.HybridWebView &&
    typeof window.HybridWebView.SendRawMessage === 'function' &&
    typeof window.HybridWebView.InvokeDotNet === 'function') ? 'api-ok' : 'api-missing';
  let framework = 'fw-unknown';
  let rawEndpoint = 'raw-endpoint-pending';
  try {
    const response = await fetch('_framework/hybridwebview.js');
    framework = 'fw-' + response.status + '-' + (response.headers.get('content-type') || 'no-ct');
  } catch (frameworkError) {
    framework = 'fw-error:' + frameworkError.message;
  }
  function describe() {
    return api + ' ' + framework + ' origin=' + window.location.origin +
      ' id=' + (window.__ohHybridId || 'none') + ' ' + rawEndpoint;
  }
  probe.textContent = describe();
  document.title = 'CHILD-HYBRID-READY';
  // The shell stamps window.__ohHybridId at the page-end bridge injection, after this script
  // ran; refresh the probe line for a few seconds so the marker shows up in the page (and in a
  // screenshot or a layout dump taken later).
  let probeRefreshes = 0;
  const probeTimer = setInterval(function () {
    probe.textContent = describe();
    if (++probeRefreshes >= 10) {
      clearInterval(probeTimer);
    }
  }, 1000);
  if (api !== 'api-ok') {
    document.title = 'CHILD-HYBRID-ERROR';
    return;
  }
  // Endpoint-level raw probe (after load, when the shell's document state is settled): one
  // __hwvSendMessage-shaped POST recorded with the shell's HTTP answer - 204 means the shell
  // forwarded it through notifyJsMessage, 400 means the endpoint guard refused it.
  try {
    const rawResponse = await fetch('__hwvSendMessage', {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain',
        'X-Maui-Invoke-Token': 'HybridWebView',
        'X-Maui-Request-Body': '__RawMessage|child-hybrid-endpoint'
      },
      body: '__RawMessage|child-hybrid-endpoint'
    });
    rawEndpoint = 'raw-endpoint-' + rawResponse.status;
  } catch (rawEndpointError) {
    rawEndpoint = 'raw-endpoint-error:' + rawEndpointError.message;
  }
  // The shell stamps window.__ohHybridId at the page-end bridge injection and the per-document
  // URL state settles with the load; the raw message is therefore sent a few times after load
  // (2/4/6 s), so at least one __hwvSendMessage POST sees the fully stamped document state.
  let rawAttempts = 0;
  const rawTimer = setInterval(function () {
    rawAttempts++;
    try {
      window.HybridWebView.SendRawMessage('child-hybrid-raw-' + rawAttempts);
    } catch (rawError) {
      probe.textContent += ' raw-error:' + rawError.message;
    }
    if (rawAttempts >= 3) {
      clearInterval(rawTimer);
    }
  }, 2000);
  try {
    const value = await window.HybridWebView.InvokeDotNet('Echo', ['child-hybrid']);
    result.textContent = 'invoke-result:' + JSON.stringify(value);
    document.title = 'CHILD-HYBRID-INVOKED';
  } catch (invokeError) {
    result.textContent = 'invoke-error:' + (invokeError && invokeError.message ? invokeError.message : String(invokeError));
    document.title = 'CHILD-HYBRID-ERROR';
  }
})();
</script>
</body>
</html>
