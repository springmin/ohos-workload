<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello-blazorwasm</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <p class="loading">Loading Blazor WebAssembly...</p>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
    </div>

    <!-- Host markers: the ArkTS page forwards BLZ_* console messages to hilog, so the kit
         tester (or Tester-run.sh) can grep `BlazorWebHost` for a machine verdict. -->
    <script>
        window.addEventListener('load', function () { console.log('BLZ_BOOT'); });
        window.addEventListener('error', function (e) { console.log('BLZ_ERROR ' + (e && e.message)); });
        window.addEventListener('unhandledrejection', function (e) { console.log('BLZ_ERROR ' + (e && e.reason)); });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
