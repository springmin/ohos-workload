name: blazor-recipe

# Recipe regression for test/hello-blazorwasm on a stock x64 runner. The Blazor WebAssembly
# publish depends on the dnceng dotnet11 flight and on the SDK pack version pins in
# Directory.Build.targets - the fork's rc.1 Blazor packages never reach nuget.org, so a
# flight moving or disappearing would silently break the recipe until someone publishes on a
# device. This job publishes the smoke twice (the default recipe and the slim kit variant)
# and fails on restore/publish regressions. The OpenHarmony-specific parts of the recipe -
# the msbuild-pipe-patch workaround and the ArkWeb host hap in arkts-host/ - are NOT
# exercised here; see test/hello-blazorwasm/README.md.
#
# Triggers: workflow_dispatch (manual) and a weekly schedule. A publish restores ~100 MB of
# wasm/Blazor packs, so the job caches the SDK + NuGet global packages and deliberately does
# not run on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  # Keep the setup-dotnet preview SDK in a cacheable per-user path instead of the runner's
  # /usr/share/dotnet (the action re-resolves the 11.0.x channel every run; the cache only
  # skips the ~200 MB download when the preview moved).
  DOTNET_INSTALL_DIR: ~/.dotnet

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cache the .NET SDK and the NuGet global packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.dotnet
            ~/.nuget/packages
          key: dotnet-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            dotnet-${{ runner.os }}-${{ github.workflow }}-
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - name: Publish the default recipe
        run: sh test/hello-blazorwasm/run-smoke.sh --require --out "$RUNNER_TEMP/smoke-full"
      - name: Publish the slim recipe (the kit variant)
        run: |
          set -eu
          sh test/hello-blazorwasm/run-smoke.sh --require --slim --out "$RUNNER_TEMP/smoke-slim"
          # --slim must drop the ICU data files (InvariantGlobalization); the script checks
          # this too, the explicit guard keeps the intent visible in the workflow.
          if find "$RUNNER_TEMP/smoke-slim/publish/wwwroot" -name 'icudt*.dat' -print -quit | grep -q .; then
            echo "ERROR: the --slim publish still carries ICU data"
            exit 1
          fi
      - name: Summary
        run: |
          {
            echo "### Blazor recipe smoke"
            echo
            echo "- default: $(find "$RUNNER_TEMP/smoke-full/publish/wwwroot" -type f | wc -l) files, $(du -sh "$RUNNER_TEMP/smoke-full/publish/wwwroot" | cut -f1)"
            echo "- slim: $(find "$RUNNER_TEMP/smoke-slim/publish/wwwroot" -type f | wc -l) files, $(du -sh "$RUNNER_TEMP/smoke-slim/publish/wwwroot" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
