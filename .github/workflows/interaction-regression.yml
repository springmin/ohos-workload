name: interaction-regression

# CI gate for the headless interaction + performance suite (test/maui-platform-verify). The suite
# compiles the MAUI OpenHarmony platform slice sources from the `springmin/maui-ohos` fork and
# references two assemblies built from this repository through HintPaths, so the job materialises
# both roots on the runner instead of depending on MAUI_SLICE_DIR / HOSTING_DLL repository
# variables:
#
#   MAUI_SLICE_DIR           <- <workspace>/maui-ohos/src/Core/src/Platform/OpenHarmony
#   HOSTING_DLL              <- <workspace>/src/Microsoft.OpenHarmony.Hosting/bin/Release/net11.0/Microsoft.OpenHarmony.Hosting.dll
#   OPENHARMONY_GRAPHICS_DLL <- <workspace>/src/Microsoft.OpenHarmony.Maui.Graphics/bin/Release/net11.0/Microsoft.OpenHarmony.Maui.Graphics.dll
#
# verify.csproj turns those environment variables into MSBuild default properties (an explicit
# -p: override still wins), so no other configuration is required. The job fails unless the suite
# exits 0, reports at least 224 "[verify]" lines (231 interaction checks - including the ten
# late-app-context HybridWebView assertions and the eighteen V8 app-context publish assertions -
# plus 4 fuzz lines, the frame-path perf line and the 8 accessibility publish-path perf lines),
# logs no "Unhandled" line, and both perf lines carry the "within=True" budget marker:
#   * the frame-path gate - 200 timed OpenHarmonyWindowRenderer.Render frames over a fixed 401-node
#     tree: average <= 20 ms, max <= 250 ms, max/average <= 100x;
#   * the accessibility publish-path gate - 50 unchanged passes vs 50 mutated passes over the same
#     tree (Refresh + Publish render step and Publish-alone pass), skip/republish average/max
#     ceilings and documented republish/skip ratio floors (render >= 1.25x, publish >= 2x).
# See the README "Performance budget" section for the rationale.
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  interaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workload (this repository)
        uses: actions/checkout@v4
      - name: Check out the maui-ohos slice sources
        uses: actions/checkout@v4
        with:
          repository: springmin/maui-ohos
          ref: feature/openharmony
          path: maui-ohos
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - name: Build the hosting assemblies the harness references
        run: |
          dotnet build src/Microsoft.OpenHarmony.Hosting/Microsoft.OpenHarmony.Hosting.csproj -c Release -v:q
          dotnet build src/Microsoft.OpenHarmony.Maui.Graphics/Microsoft.OpenHarmony.Maui.Graphics.csproj -c Release -v:q
      - name: Run the interaction + performance suite
        working-directory: test/maui-platform-verify
        env:
          MAUI_SLICE_DIR: ${{ github.workspace }}/maui-ohos/src/Core/src/Platform/OpenHarmony
          HOSTING_DLL: ${{ github.workspace }}/src/Microsoft.OpenHarmony.Hosting/bin/Release/net11.0/Microsoft.OpenHarmony.Hosting.dll
          OPENHARMONY_GRAPHICS_DLL: ${{ github.workspace }}/src/Microsoft.OpenHarmony.Maui.Graphics/bin/Release/net11.0/Microsoft.OpenHarmony.Maui.Graphics.dll
        run: |
          set -euo pipefail
          dotnet build -v:q
          dotnet bin/Debug/net11.0/verify.dll > out.txt 2>&1 || { cat out.txt; echo "::error::the interaction suite exited non-zero"; exit 1; }
          cat out.txt
          checks=$(grep -c '\[verify\]' out.txt || true)
          echo "interaction checks reported: $checks"
          if [ "$checks" -lt 224 ]; then
            echo "::error::expected at least 224 [verify] lines, got $checks"
            exit 1
          fi
          if grep -q Unhandled out.txt; then
            echo "::error::the interaction suite output contains an unhandled exception"
            exit 1
          fi
          if ! grep -q '\[verify\] perf warmup=.*within=True' out.txt; then
            echo "::error::the frame-path performance budget line is missing or reports within=False"
            exit 1
          fi
          if ! grep -q '\[verify\] perf a11y .*within=True' out.txt; then
            echo "::error::the accessibility publish-path budget line is missing or reports within=False"
            exit 1
          fi
          echo "OK: $checks [verify] lines, frame + a11y perf within budget, no unhandled exception"
