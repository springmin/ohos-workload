name: interaction-regression

# CI gate for the headless interaction + performance suite (test/maui-platform-verify). The suite
# compiles the MAUI OpenHarmony platform slice sources from the `springmin/maui-ohos` fork and
# references the first-party host/graphics projects through ProjectReferences, so the job only
# materialises the cross-repo root on the runner instead of depending on MAUI_SLICE_DIR
# repository variables:
#
#   MAUI_SLICE_DIR           <- <workspace>/maui-ohos/src/Core/src/Platform/OpenHarmony
#
# test/Directory.Build.props turns that environment variable into an MSBuild default property (an
# explicit -p: override still wins) and resolves the sibling-repo fallback relatively, so no other
# configuration is required and no machine-specific absolute path exists in the build inputs
# (scripts/check-no-absolute-paths.sh). The job fails unless the suite exits 0, prints its
# `[suite] checks=... floor=... assert=True` contract line at or above the floor, logs no
# "Unhandled" line, and both perf lines carry the "within=True" budget marker:
#   * the frame-path gate - 200 timed OpenHarmonyWindowRenderer.Render frames over a fixed 401-node
#     tree: average <= 20 ms, max <= 250 ms, raw max/average <= 100x, p95/average jitter <= 2x and
#     the managed allocation <= 13,824 B/frame (3x the post-managed-perf-batch baseline);
#   * the accessibility publish-path gate - 50 unchanged passes vs 50 mutated passes over the same
#     tree (Refresh + Publish render step and Publish-alone pass), skip/republish average/max
#     ceilings and documented republish/skip ratio floors (render >= 1.25x, publish >= 2x).
#
# The check-count floor (493 = 513 - 20, the documented convention) is declared once in
# test/maui-platform-verify/Program.cs, next to the constants that count the executed suite's own
# [verify] lines; this job reads the `[suite]` line the run prints (and cross-checks it against
# `grep -c`) instead of repeating a literal, exactly like scripts/preflight.sh, so the local gate
# cannot pass with a weaker threshold than CI. See the README "Performance budget" section for
# the allocation/jitter rationale.
#
# Triggers: push to master, pull requests and workflow_dispatch. The PR trigger catches an
# interaction/performance regression before merge (the pixel gate already ran on PRs). Fork PRs
# are safe here: the job only reads this repository and the public springmin/maui-ohos fork,
# requests no secrets, runs with the default read-only GITHUB_TOKEN (`contents: read`) and both
# checkouts set persist-credentials: false; nothing is pushed or published.
on:
  workflow_dispatch:
    inputs:
      maui_ohos_ref:
        description: 'maui-ohos commit SHA to compile (defaults to the pinned feature/openharmony tip)'
        required: false
        type: string
        default: 'ebffdd787c8e0dcd99a9c4cccfd279e2a057a494'
  push:
    branches: [ master ]
  pull_request:

# Least privilege: the job only reads this repository and the public springmin/maui-ohos fork;
# no step pushes anywhere.
permissions:
  contents: read

# Reproducible cross-repo compile: the MAUI slice is checked out at an exact commit, not the
# mutable feature/openharmony branch, so a push to the fork cannot change what this gate compiles.
# The default is the feature/openharmony tip: ebffdd787c, the rc.2 slice re-anchor
# (dotnet/maui release/11.0.1xx-rc2 349017b7 + the OpenHarmony delta, Microsoft.Maui.*
# 11.0.0-rc.2.26478.12); it carries the N6 window decoration mapping
# (OpenHarmonyWindowDecoration: system minimize/maximize/close buttons and the title-band drag
# onto the managed TitleBar row, `ohos_host_window_decor`) on top of the N5 overlay touch
# passthrough suppression (OpenHarmonyMauiAppHost consumes the stream while an overlay sets
# DisableUITouchEventPassthrough) 163e7554, the T18 Essentials IMap system-map launcher
# (OpenHarmonyMapLauncher, `geo:` Want via the ability bridge) b386b1c4, the N4 TitleBar row in
# the accessibility shadow tree 43996268, the T16 structured menus (submenu headers + MenuBar
# titles, `ohos_host_menu_item_ex`) 038449e8 and the T15 rich Shell.TitleView materialized in
# the title bar 5a24b0c5, on top of the FIX-SHELL Shell CurrentPage enumeration in
# the compositor/a11y walks a4c4bea933, the T14 rich shell flyout
# (OpenHarmonyShellFlyout: View/DataTemplate sections and item rows) d8e144a8 and the T12
# CarouselView group header/footer slides 9ab879ff, on top of the A11Y-TABBED TabbedPage
# CurrentPage fix in the accessibility walk (OpenHarmonyAccessibility.PushChildren) dc9b19a6,
# the N3 Picker/DatePicker/TimePicker IsOpen mapping 3b88f5f3, the T21 system font scale 51cb186c,
# the T13 CollectionView GroupFooter view templates 5dbd7713 and the FIX-TABBED TabbedPage
# CurrentPage in the compositor walk (ChildEnumerator) 14bdb85f, on top of the T6 flow-direction
# (RTL) mirroring for
# placement, drawing and hit-testing on top of the T8 TableView on the shared list pipeline
# 12a1971b and the N2 empty-ContentPage placement fix f96d484b, on top of the T7 DatePicker month
# calendar 843a6c7c, the T11 diagnostics overlay and its adorners 89e41efa and the T9 window title
# bar (Window.TitleBar + back slot) 05935db3, on top of the T3 GraphicsView merge b6a58645
# (a6e65250 drag/hover/multi-touch/invalidate + db9359fb drawable-replacement repaint), the T5
# layout semantics c1c05f3d (z-order, clip, input transparency, anchors), the T4 Label FormattedText
# spans 043e6468, the T10 modal accessibility overlay c56bf0fa, the T1 InputView mapping dcc7eaac
# and the T2 CookieContainer sync 8241f1b3, all on top of the W-series webview wiring d6325990,
# the SEC-SCAN-3 S3-DL3 dot-dot route rejection and the HUKS/deep-link hardening. The suite pins
# 513 checks / floor 493 (the N1 host multi-pointer lines live in this repository's harness and
# hosting bridge, not in the pinned slice) and the full run is green at this compiled tree (local
# verification: 513/513, floor 493, both perf lines within budget); advance the pin deliberately
# and refresh this comment when the harness pins or the tip move (workflow_dispatch can compile
# any commit).
env:
  MAUI_OHOS_REF: ${{ github.event.inputs.maui_ohos_ref || 'ebffdd787c8e0dcd99a9c4cccfd279e2a057a494' }}
  # setup-dotnet installs the requested 11.0.x preview into DOTNET_INSTALL_DIR; on Linux that
  # defaults to /usr/share/dotnet, which a per-user cache cannot persist. Point it at ~/.dotnet
  # (the action resolves the ~ prefix against $HOME) so the cache step below actually avoids the
  # ~200 MB SDK download on repeat runs; the installed version is still re-resolved every run, so
  # a newer 11.0.x preview is downloaded instead of silently reusing a stale SDK.
  DOTNET_INSTALL_DIR: ~/.dotnet

jobs:
  interaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workload (this repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the maui-ohos slice sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: springmin/maui-ohos
          ref: ${{ env.MAUI_OHOS_REF }}
          path: maui-ohos
          fetch-depth: 1
          persist-credentials: false
      - name: Cache the .NET SDK and the NuGet global packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # ~/.dotnet (DOTNET_INSTALL_DIR above), the NuGet global packages and restore state.
          # Key: OS + workflow + the hash of every dependency-defining file; caches are immutable,
          # so restore-keys falls back to the most recent prefix on a dependency change.
          path: |
            ~/.dotnet
            ~/.nuget/packages
          key: dotnet-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            dotnet-${{ runner.os }}-${{ github.workflow }}-
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - name: Reject machine-specific absolute paths in build inputs
        run: sh scripts/check-no-absolute-paths.sh
      - name: Add the dnceng dotnet11 feed (MAUI rc.2 daily packages)
        # The pinned slice carries Microsoft.Maui.* 11.0.0-rc.2.26478.12, a dnceng dotnet11
        # daily that is not on nuget.org yet (see docs/rc2-line-notes.md). Drop this step
        # when the official rc.2 packages ship and the slice pins move to nuget.org versions.
        run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json --name dnceng-dotnet11
      - name: Build the hosting assemblies the slice gate references
        run: |
          set -euo pipefail
          dotnet build src/Microsoft.OpenHarmony.Hosting/Microsoft.OpenHarmony.Hosting.csproj -c Release -v:q
          dotnet build src/Microsoft.OpenHarmony.Maui.Graphics/Microsoft.OpenHarmony.Maui.Graphics.csproj -c Release -v:q
      - name: Hosting context JSON smoke (FIX-INTEROP #3)
        run: |
          set -euo pipefail
          dotnet run --project test/hosting-context-json -c Release | tee hosting-json.txt
          grep -q 'HOSTING CONTEXT JSON SMOKE PASSED' hosting-json.txt
      - name: Slice trim/AOT analyzer gate (FIX-INTEROP #10)
        # The full MAUI tree's targets force the trim analyzer off when PublishAot != true, so
        # an ordinary app build can hide IL2026/IL3050 in the slice. This step builds the
        # standalone slice vehicle with the switches explicit and promotes the two IDs to
        # errors; a regression fails here instead of on device.
        run: |
          set -euo pipefail
          dotnet build maui-ohos/src/Core/src/Platform/OpenHarmony/Microsoft.Maui.Platform.OpenHarmony.csproj \
            -c Release -v:m \
            -p:IsAotCompatible=true -p:EnableTrimAnalyzer=true -p:EnableAotAnalyzer=true \
            -warnaserror:IL2026,IL3050 \
            -p:OpenHarmonyHostingAssembly="${GITHUB_WORKSPACE}/src/Microsoft.OpenHarmony.Hosting/bin/Release/net11.0/Microsoft.OpenHarmony.Hosting.dll" \
            -p:OpenHarmonyGraphicsAssembly="${GITHUB_WORKSPACE}/src/Microsoft.OpenHarmony.Maui.Graphics/bin/Release/net11.0/Microsoft.OpenHarmony.Maui.Graphics.dll" \
            | tee slice-il.txt
          grep -q 'Build succeeded' slice-il.txt
          if grep -qE 'warning IL[0-9]+' slice-il.txt; then
            echo "::error::the slice build produced IL warnings under the trim/AOT analyzers"
            exit 1
          fi
          echo "slice trim/AOT analyzer gate green: no IL warnings"
      - name: Run the interaction + performance suite
        working-directory: test/maui-platform-verify
        env:
          MAUI_SLICE_DIR: ${{ github.workspace }}/maui-ohos/src/Core/src/Platform/OpenHarmony
        run: |
          set -euo pipefail
          dotnet build -v:q
          dotnet bin/Debug/net11.0/verify.dll > out.txt 2>&1 || { cat out.txt; echo "::error::the interaction suite exited non-zero"; exit 1; }
          cat out.txt
          checks=$(grep -c '\[verify\]' out.txt || true)
          echo "interaction checks reported: $checks"
          # The suite declares its own count/floor contract; the floor is not repeated here.
          suite=$(grep -E '^\[suite\] checks=[0-9]+ total=[0-9]+ floor=[0-9]+ assert=True$' out.txt | tail -1 || true)
          if [ -z "$suite" ]; then
            echo "::error::the interaction suite did not print its [suite] checks/floor contract line or reported assert=False"
            exit 1
          fi
          suite_checks=$(printf '%s\n' "$suite" | sed -E 's/.*checks=([0-9]+).*/\1/')
          suite_floor=$(printf '%s\n' "$suite" | sed -E 's/.*floor=([0-9]+).*/\1/')
          echo "interaction suite contract: $suite"
          if [ "$checks" -ne "$suite_checks" ]; then
            echo "::error::the [suite] line reports $suite_checks checks but grep counts $checks [verify] lines"
            exit 1
          fi
          if [ "$checks" -lt "$suite_floor" ]; then
            echo "::error::expected at least $suite_floor [verify] lines (floor declared by the suite), got $checks"
            exit 1
          fi
          if grep -q Unhandled out.txt; then
            echo "::error::the interaction suite output contains an unhandled exception"
            exit 1
          fi
          if ! grep -q '\[verify\] perf warmup=.*within=True' out.txt; then
            echo "::error::the frame-path performance budget line is missing or reports within=False"
            exit 1
          fi
          if ! grep -q '\[verify\] perf a11y .*within=True' out.txt; then
            echo "::error::the accessibility publish-path budget line is missing or reports within=False"
            exit 1
          fi
          echo "OK: $checks [verify] lines (floor $suite_floor), frame + a11y perf within budget, no unhandled exception"
