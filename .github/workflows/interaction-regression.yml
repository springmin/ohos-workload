# through the child|<win>|<slot>|<url> key, the started event consuming the approval once; managed
# + shell source pins, so the rasterizer output does not move; the suite below moves to 737/740
# floor 720 - the B6 5 + A11Y-SELFCHECK 1 checks on top of the M2-M4 734 - and the export/abc pins
# are 164/164 and 542,936 (the B6 shell); merged into feature/openharmony as caa46343) on
# 277967cc (the per-window identity handshake
# (op7 ack; unknown/stale-generation events fail closed), the per-window IME/a11y/overlay/Back
# partitioning and the per-window child ArkWeb pool (child invokes dispatched by window, two
# subwindows each own their slot 0); managed + shell source pins, so the rasterizer output does
# not move; the suite below moves to 731/734 floor 714 - the M2 15 + M3 7 + M4 8 checks on top
# of the L3 M1 704 - and the export/abc pins stay 164/164 and 534,192; merged into
# feature/openharmony as 277967cc) on d1d485bb67 (the L3 a11y partition release - the
# closed window's provider state is freed through the new ohos_host_accessibility_release_for
# export, so the export set moves to 164/164 - plus the child hybrid/Blazor asset bridge (the
# subwindow shell serves hybrid/blazor assets and routes child-tagged invokes to the owning
# window's handler, no new export) and the MULTIWINDOW-L3 M1 session registry (two managed
# subwindows coexist, targeted close/reopen, capacity decline); managed + shell source pins, so
# the rasterizer output does not move; the suite below moves to 701/704 floor 684 - the
# web-assets 3 + the L3-M1 11 checks on top of the L2 690; merged into feature/openharmony as
# d1d485bb67) on bb6b06990d (the L2-a per-window a11y
# provider - the six new managed exports move the contract to 163/163 - plus the L2-b child
# ArkWeb second host, both merged with SEC-SCAN-6 A/B and the C close hook; managed + shell
# source pins, so the rasterizer output does not move; the suite below moves to 688/690 floor
# 670 - the L2-a 7 + L2-b 18 + SEC-SCAN-6 C 2 checks on top of the L final count; merged into
# feature/openharmony as bb6b06990d) on 23d98a9615 (M4: the per-window focus/suspend
# state machine, child-tagged IME/key/Back, per-window a11y shadow frames and alert ownership and
# pinch routing to the owning renderer, plus SEC-SCAN-5c's primary-window gate on the global text
# path; managed + shell source pins, so the rasterizer output does not move; the suite count below
# moves to 661/663 floor 643 - the 16 M4 checks on top of M3's 14 on M2's 22; merged into
# feature/openharmony as 74e0bde5b9) on d4ff7d445e (MULTIWINDOW-L M3: the slice consumes the
# window-id tagged channel in the app host itself, a deferred OpenWindow asks the shell for the
# subwindow XComponent and RouteSurface binds/adopts/first-frames it, secondary presents go to
# the per-window draw target and the shell source carries the surface id; managed-only, so the
# rasterizer output does not move; the suite count below moves to 645/625 floor - the 14 M3
# checks on top of M2's 22), on 1a15f56b30 (MULTIWINDOW-L M2: the slice's app host
# is windowed - one OpenHarmonyWindowHost per additional window owns its surface/renderer size
# and input, OpenWindow adopts a second managed window when a secondary surface is available
# (otherwise the honest CurrentWindowKept degrade) and the window-id routing entries
# RouteSurface/RouteTouch/RouteFrame drive exactly one window; managed-only, so the rasterizer
# output does not move; the suite count below moves to 629/631 floor 611 - the 22 dual-window
# checks driven through this repository's window-id tagged hosting bridge), on top of b093e33825
# (MULTIWINDOW-M: the managed slice hosts
# an application subwindow - OpenHarmonySubWindow drives the shell's named-route SubWindow page
# through the create/move/resize/show/close command set and the shell->managed event listener,
# with the host's ohos_host_sub_window_command / ohos_host_sub_window_event_listener exports and
# the off-device degradation markers; shell/host/managed, so the rasterizer output does not move;
# SEC-SCAN-4 5f3efd55e5 masks password Entry text in the accessibility shadow tree and pins the
# off-surface cull boundary; the suite count moved to 607/609 floor 589 (601/603 after
# SEC-SCAN-4's +2, then MULTIWINDOW-M's +6 at that tip)), on top of ed02203bfd (MULTIWINDOW-S: the
# managed app host re-arranges and re-renders on a live surface Changed while Destroyed/0x0 keeps
# the last frame, and the shell/marker declare the 2in1 window modes; managed-only, no new host
# export, and the suite count below moves to 599/601 floor 581 - 598/600 at that wave plus this
# repository's CG2-R2R interp R2R opt-out pin), on top of d5384d6cc3 (FIX-A11YFLYOUT: OpenHarmonyAccessibility.
# PushChildren publishes a FlyoutPage's Detail pane always and its Flyout pane only while
# IsPresented, mirroring the compositor's ChildEnumerator - before the branch the a11y walk only
# reached the flyout page's root and published nodeCount=1; managed-only, no new host export, and
# the suite count below moves to 593/595 floor 575), on top of 6652017ca5 (INTERP-DRAW2: the
# compositor skips a node's own drawing when its canvas rectangle lies outside the render surface
# and no canvas shift - translation/scale/rotation/scroll - can move its pixels back in, while the
# subtree is still walked so an off-parent-frame child keeps painting; the per-node transform inputs are
# read once, and the DrawCostTick/DrawKind* seam reports the draw kind for the draw-cost split;
# managed-only, no new host export, and the suite count moved to 591/593 floor 573), on top
# of 189b87ca8a (AUTODISCONNECT: the page, ContentView
# and Layout handlers watch their element subtree's DescendantRemoved/DescendantAdded events and
# drive the slice-local overlay-slot lifetime contract - a detached control sends a tagged hide,
# drops its claim (a dynamic slot is destroyed in the shell) and is marked for a replay, while a
# re-added/later-arranged control re-claims a slot and replays its load/registration; the handler
# stays connected, the LRU preempt/restore semantics are unchanged, no new host export, and the
# suite moves to 587/589 floor 569), on top of 7c731a7ca3 (INTERP-RENDER: gate the per-frame
# layout pass - Measure/Arrange only runs when the render root/size/safe-area insets/TitleBar row
# change, the root reports MeasureInvalidated or the slice's layout-invalidation version moves
# (IView.InvalidateMeasure and ILayoutHandler Add/Remove/Clear/Insert/Update); 22.0 -> 30.1 fps,
# meas 13.0 -> 0.0 ms, no new host export and the suite stays at 584/586), on top of 3feb347414
# (SLOTS-DYNAMIC: route the shell
# overlay-capacity event into the managed pool so the pool can create/destroy dynamic ArkWeb
# slots on demand; managed/shell-only - no new host export - and the suite count below moves to
# 584/586), on top of 549967f2f0 (FIX-SLICERACE: a re-entrant connect
# lock serializes Connect/ConnectTree against the shell-thread surface/frame callbacks and the
# app host serializes every tree-touching entry behind a ready latch; L6 96034e2acf adds the
# Jpeg screenshot format/quality host export and the Window.Title foreground heartbeat;
# SAMPLE-FIX 1926cf68b6 accepts the pack-staged HybridWebView bootstrap script; LEGACY
# 7064bb8c1c mirrors the Core Toolbar icons/order/priority and draws/hit-tests the shell bar),
# on top of 07423dfe93 (MULTI-OVERLAY-FULL: LRU overlay-slot
# reuse behind the IOpenHarmonyOverlaySlotOwner preempt/restore contract, per-slot hybrid serve/
# message/invoke channels with slot-tagged request ids, activation-ordered z-order and the
# payload-in-libs appDir probe; MULTI-OVL 75c410e798 below adds one ArkWeb overlay slot per web
# handler), on top of 15d81f31b1 (FIX-JSCALL: root the BlazorWebView IPC's
# JSCallResultType/JSCallType/NavigationOptions value types in OpenHarmonySliceJsonContext so the
# package's reflection-only IpcCommon serialize path keeps the resolver-built EnumConverter
# instantiations in the AOT image, and drop the stub-interop click probe), on top of 52b082a071
# (FIX-BWVMount: mount the BlazorWebView page under NativeAOT - the handler's static constructor
# touches the source-generated JsonElement[] type info so the package's reflection-only
# ArrayConverter stays in the AOT image, plus start/connect diagnostics and a message-time
# BLZ_DIAG probe), on top of be09a48817
# (FIX-BACKSIZE: the system Back press from the shell/host bridge closes a presented drawer -
# the flyout/shell handlers subscribe to OpenHarmonyBridge.BackPressed and write
# IsPresented/FlyoutIsPresented, otherwise report unhandled - and the BlazorWebView handler
# reports a real desired size (width = the constraint, height = min(400, the constraint) or the
# explicit HeightRequest; no frame while a hybrid overlay is registered)), on top of 47d79add01
# (FIX-WVP: the ArkWeb overlay converts
# the element frame from device pixels to vp, keeps the hybrid registration when a later Blazor
# load follows, draws above the managed surface and suspends under a presented drawer/tab
# switch), on top of 86b439ffc8 (FIX-DISMISS: the flyout page's default layout behavior is
# stated as Popover at connect, so an outside tap dismisses it under the device's landscape +
# non-phone display conditions), on top of 68ec598037 (FIX-HOME: the NavigationPage
# handler descends its arrange into its current page - the Hello Home tab's content subtree
# draws), on top of eec30c01cd, the W9 consolidation on top of the
# rc.2 slice re-anchor ebffdd787c (dotnet/maui release/11.0.1xx-rc2 349017b7 + the OpenHarmony
# delta, Microsoft.Maui.* 11.0.0-rc.2.26478.12): W9B T14 flyout leftovers + T21 font-scale
# wiring, W9C T8 uneven TableView rows, W9D T20 media bridge and W9A B2 staged-WASM WebView.
# The rc.2 tree carries the N6 window decoration mapping
# (OpenHarmonyWindowDecoration: system minimize/maximize/close buttons and the title-band drag
# onto the managed TitleBar row, `ohos_host_window_decor`) on top of the N5 overlay touch
# passthrough suppression (OpenHarmonyMauiAppHost consumes the stream while an overlay sets
# DisableUITouchEventPassthrough) 163e7554, the T18 Essentials IMap system-map launcher
# (OpenHarmonyMapLauncher, `geo:` Want via the ability bridge) b386b1c4, the N4 TitleBar row in
# the accessibility shadow tree 43996268, the T16 structured menus (submenu headers + MenuBar
# titles, `ohos_host_menu_item_ex`) 038449e8 and the T15 rich Shell.TitleView materialized in
# the title bar 5a24b0c5, on top of the FIX-SHELL Shell CurrentPage enumeration in
# the compositor/a11y walks a4c4bea933, the T14 rich shell flyout
# (OpenHarmonyShellFlyout: View/DataTemplate sections and item rows) d8e144a8 and the T12
# CarouselView group header/footer slides 9ab879ff, on top of the A11Y-TABBED TabbedPage
# CurrentPage fix in the accessibility walk (OpenHarmonyAccessibility.PushChildren) dc9b19a6,
# the N3 Picker/DatePicker/TimePicker IsOpen mapping 3b88f5f3, the T21 system font scale 51cb186c,
# the T13 CollectionView GroupFooter view templates 5dbd7713 and the FIX-TABBED TabbedPage
# CurrentPage in the compositor walk (ChildEnumerator) 14bdb85f, on top of the T6 flow-direction
# (RTL) mirroring for
# placement, drawing and hit-testing on top of the T8 TableView on the shared list pipeline
# 12a1971b and the N2 empty-ContentPage placement fix f96d484b, on top of the T7 DatePicker month
# calendar 843a6c7c, the T11 diagnostics overlay and its adorners 89e41efa and the T9 window title
# bar (Window.TitleBar + back slot) 05935db3, on top of the T3 GraphicsView merge b6a58645
# (a6e65250 drag/hover/multi-touch/invalidate + db9359fb drawable-replacement repaint), the T5
# layout semantics c1c05f3d (z-order, clip, input transparency, anchors), the T4 Label FormattedText
# spans 043e6468, the T10 modal accessibility overlay c56bf0fa, the T1 InputView mapping dcc7eaac
# and the T2 CookieContainer sync 8241f1b3, all on top of the W-series webview wiring d6325990,
# the SEC-SCAN-3 S3-DL3 dot-dot route rejection and the HUKS/deep-link hardening. The suite pins
# 688 checks / total 690 / floor 670 (the N1 host multi-pointer, W10 AOT-entry, FIX-BACKSIZE,
# Back-press, MULTI-OVERLAY-FULL, SLOTS-DYNAMIC, L6/LEGACY, FIX-SLICERACE, the AUTODISCONNECT
# detach/rebuild drill, the FIX-A11YBUTTON shell self-check, the FIX-A11YFLYOUT a11y-walk /
# FIX-PREEMPT-RAW capacity-export lines, the MULTIWINDOW-M subwindow lines and the MULTIWINDOW-L
# M2 dual-window pin live in this repository's harness and hosting bridge, not in the pinned
# slice; the harness references the slice's PushChildren FlyoutPage branch, the OpenHarmonySubWindow
# command/event machine, the windowed app host's RouteSurface/RouteTouch/RouteFrame entries and
# the DrawCostTick/DrawKind* seam directly, so this pin must not lag the harness; the 14 M3
# checks pin the tagged-channel production subscription, the deferred OpenWindow bind/first
# frame/input/close/same-id reopen and the four packs' XComponent source plus the per-window
# draw-target seams; the 16 M4 checks pin the per-window focus/suspend-resume machine, the tagged
# IME/text/Back wire with the SEC-SCAN-5c primary->child isolation pin, the per-window a11y
# frame/alert partition and the pinch routing (child-tagged only; main/unknown/empty ids rejected),
# plus the four-pack shell source pins) and the full run
# is green at this compiled tree (local verification: 756/759, floor 739, both perf lines within
# budget); advance the pin deliberately and refresh this comment when the harness pins or the
# tip move (workflow_dispatch can compile any commit).
env:
  MAUI_OHOS_REF: ${{ github.event.inputs.maui_ohos_ref || '4fa017090076b510bdea97a6cd77df57446d1577' }}
  # setup-dotnet installs the requested 11.0.x preview into DOTNET_INSTALL_DIR; on Linux that
  # defaults to /usr/share/dotnet, which a per-user cache cannot persist. Point it at ~/.dotnet
  # (the action resolves the ~ prefix against $HOME) so the cache step below actually avoids the
  # ~200 MB SDK download on repeat runs; the installed version is still re-resolved every run, so
  # a newer 11.0.x preview is downloaded instead of silently reusing a stale SDK.
  DOTNET_INSTALL_DIR: ~/.dotnet

jobs:
  interaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workload (this repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the maui-ohos slice sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: springmin/maui-ohos
          ref: ${{ env.MAUI_OHOS_REF }}
          path: maui-ohos
          fetch-depth: 1
          persist-credentials: false
      - name: Cache the .NET SDK and the NuGet global packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # ~/.dotnet (DOTNET_INSTALL_DIR above), the NuGet global packages and restore state.
          # Key: OS + workflow + the hash of every dependency-defining file; caches are immutable,
          # so restore-keys falls back to the most recent prefix on a dependency change.
          path: |
            ~/.dotnet
            ~/.nuget/packages
          key: dotnet-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            dotnet-${{ runner.os }}-${{ github.workflow }}-
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - name: Reject machine-specific absolute paths in build inputs
        run: sh scripts/check-no-absolute-paths.sh
      - name: Add the dnceng dotnet11 feed (MAUI rc.2 daily packages)
        # The pinned slice carries Microsoft.Maui.* 11.0.0-rc.2.26478.12, a dnceng dotnet11
        # daily that is not on nuget.org yet (see docs/rc2-line-notes.md). Drop this step
        # when the official rc.2 packages ship and the slice pins move to nuget.org versions.
        run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json --name dnceng-dotnet11
      - name: Build the hosting assemblies the slice gate references
        run: |
          set -euo pipefail
          dotnet build src/Microsoft.OpenHarmony.Hosting/Microsoft.OpenHarmony.Hosting.csproj -c Release -v:q
          dotnet build src/Microsoft.OpenHarmony.Maui.Graphics/Microsoft.OpenHarmony.Maui.Graphics.csproj -c Release -v:q
      - name: Hosting context JSON smoke (FIX-INTEROP #3)
        run: |
          set -euo pipefail
          dotnet run --project test/hosting-context-json -c Release | tee hosting-json.txt
          grep -q 'HOSTING CONTEXT JSON SMOKE PASSED' hosting-json.txt
      - name: Slice trim/AOT analyzer gate (FIX-INTEROP #10)
        # The full MAUI tree's targets force the trim analyzer off when PublishAot != true, so
        # an ordinary app build can hide IL2026/IL3050 in the slice. This step builds the
        # standalone slice vehicle with the switches explicit and promotes the two IDs to
        # errors; a regression fails here instead of on device.
        run: |
          set -euo pipefail
          dotnet build maui-ohos/src/Core/src/Platform/OpenHarmony/Microsoft.Maui.Platform.OpenHarmony.csproj \
            -c Release -v:m \
            -p:IsAotCompatible=true -p:EnableTrimAnalyzer=true -p:EnableAotAnalyzer=true \
            -warnaserror:IL2026,IL3050 \
            -p:OpenHarmonyHostingAssembly="${GITHUB_WORKSPACE}/src/Microsoft.OpenHarmony.Hosting/bin/Release/net11.0/Microsoft.OpenHarmony.Hosting.dll" \
            -p:OpenHarmonyGraphicsAssembly="${GITHUB_WORKSPACE}/src/Microsoft.OpenHarmony.Maui.Graphics/bin/Release/net11.0/Microsoft.OpenHarmony.Maui.Graphics.dll" \
            | tee slice-il.txt
          grep -q 'Build succeeded' slice-il.txt
          if grep -qE 'warning IL[0-9]+' slice-il.txt; then
            echo "::error::the slice build produced IL warnings under the trim/AOT analyzers"
            exit 1
          fi
          echo "slice trim/AOT analyzer gate green: no IL warnings"
      - name: Run the interaction + performance suite
        working-directory: test/maui-platform-verify
        env:
          MAUI_SLICE_DIR: ${{ github.workspace }}/maui-ohos/src/Core/src/Platform/OpenHarmony
        run: |
          set -euo pipefail
          dotnet build -v:q
          dotnet bin/Debug/net11.0/verify.dll > out.txt 2>&1 || { cat out.txt; echo "::error::the interaction suite exited non-zero"; exit 1; }
          cat out.txt
          checks=$(grep -c '\[verify\]' out.txt || true)
          echo "interaction checks reported: $checks"
          # The suite declares its own count/floor contract; the floor is not repeated here.
          suite=$(grep -E '^\[suite\] checks=[0-9]+ total=[0-9]+ floor=[0-9]+ assert=True$' out.txt | tail -1 || true)
          if [ -z "$suite" ]; then
            echo "::error::the interaction suite did not print its [suite] checks/floor contract line or reported assert=False"
            exit 1
          fi
          suite_checks=$(printf '%s\n' "$suite" | sed -E 's/.*checks=([0-9]+).*/\1/')
          suite_floor=$(printf '%s\n' "$suite" | sed -E 's/.*floor=([0-9]+).*/\1/')
          echo "interaction suite contract: $suite"
          if [ "$checks" -ne "$suite_checks" ]; then
            echo "::error::the [suite] line reports $suite_checks checks but grep counts $checks [verify] lines"
            exit 1
          fi
          if [ "$checks" -lt "$suite_floor" ]; then
            echo "::error::expected at least $suite_floor [verify] lines (floor declared by the suite), got $checks"
            exit 1
          fi
          if grep -q Unhandled out.txt; then
            echo "::error::the interaction suite output contains an unhandled exception"
            exit 1
          fi
          if ! grep -q '\[verify\] perf warmup=.*within=True' out.txt; then
            echo "::error::the frame-path performance budget line is missing or reports within=False"
            exit 1
          fi
          if ! grep -q '\[verify\] perf a11y .*within=True' out.txt; then
            echo "::error::the accessibility publish-path budget line is missing or reports within=False"
            exit 1
          fi
          echo "OK: $checks [verify] lines (floor $suite_floor), frame + a11y perf within budget, no unhandled exception"
