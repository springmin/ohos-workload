name: markdownlint

# Lints every Markdown file this repository owns with markdownlint-cli2 (npm package, pinned to
# the exact version whose behaviour is recorded in .markdownlint-cli2.jsonc). The gate is
# blocking on purpose:
#
#   - the lint set is four tracked files, so a run takes seconds;
#   - the files include the two shipped `packs/**/templates/ets/pages/README.md` copies and
#     test/maui-platform-verify/README.md, where a broken table or malformed list is a real
#     defect in something users or CI read;
#   - three rules are already disabled (with reasons) in .markdownlint-cli2.jsonc, so the gate
#     only enforces what the existing docs satisfy.
#
# The config file supplies the globs (all .md/.markdown) and the ignored generated trees
# (.arkts-build/, .feed/, .signing/, dist/, node_modules and the runtime pack layout), so no
# arguments are passed here.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the repository; no step pushes anywhere.
permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Supply chain: markdownlint-cli2 is pinned to the exact 0.23.3 the config was written for,
      # but npx resolves it (and its transitive dependencies) from the npm registry at run time.
      # The job token is read-only and no secrets are exposed, so a compromised package could at
      # most tamper with this run's lint output. Residual: identical commits can lint differently
      # if a transitive dependency's published contents change.
      - name: Lint Markdown (markdownlint-cli2 0.23.3)
        run: npx --yes markdownlint-cli2@0.23.3
