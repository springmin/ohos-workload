name: ohos-workload-selftest

# Offline contract tests for the device-test kit scripts. The suites stub
# hdc, signing and the kit runtime, so this job needs no device, no
# OpenHarmony SDK and no network. Keep it that way: a test that needs any of
# those belongs in a device round, not here.
on:
  push:
    paths:
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/ohos-workload-selftest.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/ohos-workload-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run; the suites are seconds long.
concurrency:
  group: ohos-workload-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ohos-workload
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The device-round selftest needs the OpenHarmony host's patched hdc;
      # keep its Blazor-host regression covered here with a cheap contract and
      # leave the full round to the host.
      - name: device-round Blazor-host contract
        if: ${{ !cancelled() }}
        run: grep -q 'aa force-stop $BLAZOR_BUNDLE' scripts/device-round.sh

      # The kits default to the approved OpenHarmony scratch base; create it
      # so the scripts behave exactly as they do on the host.
      - name: Prepare the OpenHarmony scratch base
        if: ${{ !cancelled() }}
        run: |
          sudo mkdir -p /data/storage/el2/base/tmp/opencode
          sudo chown -R "$USER":"$(id -gn)" /data/storage/el2/base/tmp/opencode

      - name: device-test-kit pack contract (aot/jit/interp shapes)
        if: ${{ !cancelled() }}
        run: sh scripts/selftest-make-device-test-kit.sh

      - name: perf-gate comparator contract
        if: ${{ !cancelled() }}
        run: sh scripts/selftest-perf-gate.sh

      - name: selfsign contract
        if: ${{ !cancelled() }}
        run: sh scripts/selftest-selfsign.sh

      - name: repository hygiene (relative build inputs)
        if: ${{ !cancelled() }}
        run: sh scripts/selftest-repo-hygiene.sh
