name: host-export-contract

# CI gate for FIX-INTEROP #1: libopenharmonyhost.so is compiled as C++, so a host function
# without C linkage exports only a _Z... mangled symbol and the managed P/Invoke EntryPoint
# lookup fails at runtime - on device, after the app ships. The NDK build enforces the built
# library in scripts/build-host.sh (nm -D against src/OpenHarmonyHost/host-exports.txt); this
# job is the NDK-free half and catches a regression before merge:
#   1. static linkage check - every name in host-exports.txt must either be declared in
#      openharmony_host.h (whose extern "C" block covers the header) or have a definition
#      inside an extern "C" region in the native sources;
#   2. full managed cross-check - resolve every DllImport EntryPoint (including
#      EntryPoint = <const> forms) in the maui-ohos platform slice and this repository's
#      hosting/graphics sources against host-exports.txt and fail when a managed requirement
#      is not listed (a new DllImport must update the contract in the same PR).
#
# Least privilege: both checkouts are read-only (persist-credentials: false), nothing is
# pushed or published, no secrets are requested.
on:
  workflow_dispatch:
    inputs:
      maui_ohos_ref:
        description: 'maui-ohos commit SHA to cross-check (defaults to the pinned slice tip)'
        required: false
        type: string
        default: '843a6c7cd258742e9903d49a9c988bc79032ea17'
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

# Reproducible cross-repo check: the slice is checked out at an exact commit, not the mutable
# feature/openharmony branch, so a push to the fork cannot change what this gate verifies.
# Current tip: 843a6c7c (the T7 DatePicker month calendar with Min/Max clamping, the T11
# diagnostics overlay and its adorners 89e41efa and the T9 window title bar 05935db3, on top of
# the T3 GraphicsView merge b6a58645, the T5 layout semantics c1c05f3d, the T4 Label spans, the
# T10 modal accessibility overlay, the T1 InputView mapping dcc7eaac and T2 WebView CookieContainer
# sync 8241f1b3, after the SEC-SCAN-3 webview + deep-link batch: the ArkWeb history/frame/cookie
# handlers, the S3-DL3 dot-dot route rejection and the HUKS/keystore hardening; the T3/T4/T5/T10
# and T9/T11/T7 batches add no host exports, so the host export contract is still 143/143).
# Advance the pin deliberately, in lockstep with the interaction/pixel gates.
env:
  MAUI_OHOS_REF: ${{ github.event.inputs.maui_ohos_ref || '843a6c7cd258742e9903d49a9c988bc79032ea17' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workload (this repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the maui-ohos slice sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: springmin/maui-ohos
          ref: ${{ env.MAUI_OHOS_REF }}
          path: maui-ohos
          fetch-depth: 1
          persist-credentials: false
      - name: Check the host export contract (static + managed cross-check)
        run: |
          set -euo pipefail
          python3 scripts/check-host-exports.py --cross-check \
            --maui-dir maui-ohos/src/Core/src/Platform/OpenHarmony | tee contract.txt
          grep -q '^OK: ' contract.txt
          echo "host export contract verified (see the report above)"
