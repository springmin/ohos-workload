name: host-export-contract

# CI gate for FIX-INTEROP #1: libopenharmonyhost.so is compiled as C++, so a host function
# without C linkage exports only a _Z... mangled symbol and the managed P/Invoke EntryPoint
# lookup fails at runtime - on device, after the app ships. The NDK build enforces the built
# library in scripts/build-host.sh (nm -D against src/OpenHarmonyHost/host-exports.txt); this
# job is the NDK-free half and catches a regression before merge:
#   1. static linkage check - every name in host-exports.txt must either be declared in
#      openharmony_host.h (whose extern "C" block covers the header) or have a definition
#      inside an extern "C" region in the native sources;
#   2. full managed cross-check - resolve every DllImport EntryPoint (including
#      EntryPoint = <const> forms) in the maui-ohos platform slice and this repository's
#      hosting/graphics sources against host-exports.txt and fail when a managed requirement
#      is not listed (a new DllImport must update the contract in the same PR).
#
# Least privilege: both checkouts are read-only (persist-credentials: false), nothing is
# pushed or published, no secrets are requested.
on:
  workflow_dispatch:
    inputs:
      maui_ohos_ref:
        description: 'maui-ohos commit SHA to cross-check (defaults to the pinned slice tip)'
        required: false
        type: string
        default: 'd1d485bb67ad6f966f3029123340aad2691928fa'
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

# Reproducible cross-repo check: the slice is checked out at an exact commit, not the mutable
# feature/openharmony branch, so a push to the fork cannot change what this gate verifies.
# Current tip: d1d485bb67 (L3 merged: the a11y close-hook release adds
# ohos_host_accessibility_release_for, so the export set moves to 164/164; the child
# hybrid/Blazor asset bridge routes child-tagged invokes through the existing
# ohos_host_hwv_invoke_result and the M1 two-session registry adds no DllImport) on bb6b06990d (MULTIWINDOW-L2 merged: the L2-a per-window a11y provider adds six
# exports - ohos_host_accessibility_{begin,commit,node,provider_status,send_event}_for and
# set_window_action_listener - so the export set moves to 163/163; the L2-b child ArkWeb host
# rides the existing ohos_host_web_command/eval wire (NAPI properties, no new export); SEC-SCAN-6
# A/B/C are in) on 23d98a9615 (MULTIWINDOW-L final: M4 routes the per-window pinch streams to the
# owning renderer through the new ohos_host_register_window_pinch export in the
# host_window_bridge.c contract table, so the export set moves to 157/157; the per-window
# focus/IME/lifecycle/a11y/alert partition and SEC-SCAN-5c's primary-window text gate are
# managed/shell-side and add no further DllImport; merged into feature/openharmony as
# 74e0bde5b9) on d4ff7d445e (MULTIWINDOW-L M3: the slice's app host consumes the window-id tagged
# channel itself (ignoring main), OpenWindow defers to the shell subwindow surface and binds it,
# and the per-window draw target calls this repository's new hosting exports
# ohos_host_draw_begin_window / ohos_host_draw_present_window, so the export set moves to
# 156/156) on 1a15f56b30 (MULTIWINDOW-L M2: the slice's app host is windowed - per-window
# surface/renderer state, window-id routing entries RouteSurface/RouteTouch/RouteFrame and the
# OpenWindow OpenedWindow/CurrentWindowKept split; the slice is managed-only and adds no
# DllImport, while this repository's hosting assembly registers the per-window bridge, so the
# export set moves to 154/154) on b093e33825 (MULTIWINDOW-M: the managed slice hosts an application subwindow -
# OpenHarmonySubWindow drives the shell's named-route SubWindow page through the
# create/move/resize/show/close command set and the shell->managed event listener; the host adds
# ohos_host_sub_window_command and ohos_host_sub_window_event_listener, so the export set moves to
# 153/153; SEC-SCAN-4 5f3efd55e5 masks password Entry text in the accessibility shadow tree and
# adds no DllImport) on ed02203bfd (MULTIWINDOW-S: the managed app host arranges on a live surface
# Created/Changed and keeps the last frame on Destroyed/0x0; managed-only, no new host export, so
# the export set stays 151/151) on d5384d6cc3 (FIX-A11YFLYOUT: OpenHarmonyAccessibility.PushChildren's FlyoutPage
# Detail / presented-Flyout branch is managed-only and adds no DllImport, so the export set stays
# 151/151) on 6652017ca5 (INTERP-DRAW2: the off-surface draw cull and the DrawCostTick/DrawKind*
# seam are managed-only and add no DllImport, so the export set stayed 151/151) on 189b87ca8a
# (AUTODISCONNECT: the subtree lifetime watcher, the detached/re-attached
# control contract and the replay bookkeeping are managed/shell-side and add no DllImport;
# INTERP-RENDER 7c731a7ca3: the layout gate and its invalidation-version signal are managed-only)
# on 3feb347414 (SLOTS-DYNAMIC: the dynamic overlay slot pool, the shell
# ensure/destroy slot lifecycle and the overlay-capacity event routing are managed/shell-side and
# add no DllImport, so the export set stays 151/151) on 549967f2f0 (FIX-SLICERACE/L6/SAMPLE-FIX/
# LEGACY: only L6 96034e2acf moves the
# contract - it adds the Jpeg screenshot format/quality entry `ohos_host_screenshot_format` (host
# definition + header, host-exports.txt 151 entries, the shell image packer call and the managed
# DllImport); the race serialization, the pack-staged HybridWebView bootstrap and the Core
# Toolbar mirror are managed/shell-side, so the export set is 151/151) on 07423dfe93
# (MULTI-OVERLAY-FULL/MULTI-OVL: the LRU overlay slots, per-slot hybrid
# channels/invoke ids, activation z-order and payload-in-libs appDir changes are all
# managed/shell-side, so the export set does not move; 150/150) on 15d81f31b1 (FIX-JSCALL: root
# the BlazorWebView IPC's JSCallResultType/JSCallType/
# NavigationOptions value types in OpenHarmonySliceJsonContext for NativeAOT and drop the
# stub-interop click probe; managed-only, the export set does not move) on 52b082a071
# (FIX-BWVMount: mount the BlazorWebView page under NativeAOT - the handler's static constructor
# touches the source-generated JsonElement[] type info so the package's reflection-only
# ArrayConverter stays in the AOT image; managed-only for this contract)
# on be09a48817 (FIX-BACKSIZE: the system Back press routing and the BlazorWebView desired size
# are slice-side, and the host-side registration hook `ohos_host_register_back_pressed` is this
# repository's own addition) on 47d79add01 (FIX-WVP:
# shell overlay px->vp/hybrid arbitration/z-order/suspend;
# the only new cross-boundary signal is the managed hosting WebCommandSent event, no new host
# exports) on 86b439ffc8 (FIX-DISMISS: the flyout page's default layout behavior is stated as
# Popover at connect - managed-only) on 68ec598037 (FIX-HOME: the NavigationPage handler
# descends its arrange into
# the current page, so the Hello Home tab - a FlyoutPage/TabbedPage/NavigationPage shape -
# draws; no new host exports) on eec30c01cd (the W9 consolidation: W9B T14 flyout leftovers + T21 font-scale
# wiring, W9C T8 uneven TableView rows, W9D T20 media bridge adding the three ohos_host_media_*
# exports and W9A B2 staged-WASM WebView; on top of the rc.2 slice re-anchor ebffdd787c:
# dotnet/maui release/11.0.1xx-rc2
# 349017b7 + the OpenHarmony delta, Microsoft.Maui.* 11.0.0-rc.2.26478.12; the N6 window
# decoration mapping - it adds `ohos_host_window_decor` for
# the caption buttons/title-band drag - on top of the N5 overlay touch passthrough suppression
# 163e7554, the T18 Essentials IMap system-map launcher b386b1c4, the N4 TitleBar accessibility
# row 43996268, the T16 structured menus - it adds `ohos_host_menu_item_ex` for submenu headers
# and MenuBar titles - and the T15 rich Shell.TitleView 5a24b0c5, on top of the FIX-SHELL Shell
# CurrentPage enumeration in the compositor/a11y
# walks a4c4bea933, the T14 rich shell flyout d8e144a8 and the T12 CarouselView group slides
# 9ab879ff, on top of the A11Y-TABBED TabbedPage CurrentPage fix in the accessibility walk
# dc9b19a6, the N3 Picker/DatePicker/TimePicker IsOpen mapping 3b88f5f3, the T21 system font
# scale 51cb186c, the T13 CollectionView GroupFooter view templates 5dbd7713 and the FIX-TABBED
# TabbedPage CurrentPage in the compositor walk 14bdb85f, on top of the T6 flow-direction (RTL)
# mirroring, the T8
# TableView on the shared list pipeline 12a1971b and the N2 empty-ContentPage placement fix
# f96d484b, on top of the T7 DatePicker month calendar 843a6c7c, the T11
# diagnostics overlay and its adorners 89e41efa and the T9 window title bar 05935db3, on top of
# the T3 GraphicsView merge b6a58645, the T5 layout semantics c1c05f3d, the T4 Label spans, the
# T10 modal accessibility overlay, the T1 InputView mapping dcc7eaac and T2 WebView CookieContainer
# sync 8241f1b3, after the SEC-SCAN-3 webview + deep-link batch: the ArkWeb history/frame/cookie
# handlers, the S3-DL3 dot-dot route rejection and the HUKS/keystore hardening; the T3/T4/T5/T10,
# T9/T11/T7, N2/T8/T6, FIX-TABBED, A11Y-TABBED and the T12/T14/FIX-SHELL batches add no host
# exports, T13/T21/N3 only extend the managed slice, and T15/N4/T18/N5 are managed-only, so with
# the T16/N6 bridge additions and the T20 media bridge (ohos_host_media_request /
# ohos_host_media_register_result / ohos_host_media_register_event) and the FIX-BACKSIZE
# back-press hook (ohos_host_register_back_pressed, consumed by this repository's hosting
# bridge), the FIX-JSCALL AOT-roots fix, the MULTI-OVERLAY-FULL/MULTI-OVL slice changes, the
# FIX-SLICERACE serialization and the SAMPLE-FIX pack-staged bootstrap (managed/shell-only; no
# new DllImport) keep the contract at 150/150 until L6 adds `ohos_host_screenshot_format` (the
# screenshot sink's format/quality request) as the 151st entry, so the host export contract is
# 151/151).
# Advance the pin deliberately, in lockstep with the interaction/pixel gates.
env:
  MAUI_OHOS_REF: ${{ github.event.inputs.maui_ohos_ref || 'd1d485bb67ad6f966f3029123340aad2691928fa' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workload (this repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the maui-ohos slice sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: springmin/maui-ohos
          ref: ${{ env.MAUI_OHOS_REF }}
          path: maui-ohos
          fetch-depth: 1
          persist-credentials: false
      - name: Check the host export contract (static + managed cross-check)
        run: |
          set -euo pipefail
          python3 scripts/check-host-exports.py --cross-check \
            --maui-dir maui-ohos/src/Core/src/Platform/OpenHarmony | tee contract.txt
          grep -q '^OK: ' contract.txt
          echo "host export contract verified (see the report above)"
