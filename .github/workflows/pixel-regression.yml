name: pixel-regression

# CI gate for the headless pixel suite (test/headless-render). The project compiles the MAUI
# OpenHarmony platform slice sources from the `springmin/maui-ohos` fork and references the
# first-party host/graphics projects through ProjectReferences, so the job only points the build
# at the cross-repo checkout through an environment variable instead of depending on the
# development machine layout:
#
#   MAUI_SLICE_DIR <- <workspace>/maui-ohos/src/Core/src/Platform/OpenHarmony
#
# test/Directory.Build.props turns the environment variable into an MSBuild default (an explicit
# -p: override still wins) and resolves the sibling-repo default relatively, so no machine-specific
# absolute path exists in the build inputs (scripts/check-no-absolute-paths.sh enforces that).
# The suite runs exactly once (the run's stdout is teed to result.txt) and the job fails unless it
# exits 0 and printed "PIXEL ASSERTIONS PASSED".
#
# Pixel-expectation policy (documented so the special cases below are not changed silently):
#   * "button rounded corner" is the only Check(...) with tolerance=0 on a *derived* colour: the
#     pixel one step inside the button's top-left corner must stay exactly the page background
#     (DarkSlateBlue). The managed rasterizer is deterministic off-device (no GPU/anti-aliasing
#     variance), so exactness is the intended assertion - a shifted corner radius, a lost clip or
#     an over-drawing border shows up as a 1/255+ deviation. If the compositor ever changes the
#     corner geometry on purpose, fix the expectation together with that change and document it
#     here; never loosen the tolerance to make a failure pass. (The checkbox box-stroke check
#     joined this exact tolerance after its root cause was fixed below.)
#   * the former "selection tint" Known(...) finding is now a counted Check with tolerance 0:
#     HeadlessCanvas.Blend quantizes the 0.35 alpha to a byte first (89/255) and truncates the
#     blended channel, so the expectation is computed with the same byte quantization
#     (QuantizedBlend in Program.cs) instead of the float blend - the exact #3959B3 is
#     deterministic and environment-independent, while the float blend read one LSB high in green
#     (#395AB3). The earlier finding, "checkbox box stroke", was fixed the same way:
#     HeadlessCanvas.DrawRectangle now paints the outline in StrokeColor (DrawPath/DrawLine
#     semantics) instead of the stale FillColor. Only real Check()/boolean failures fail the job;
#     a known deviation must stay visible in every run rather than being deleted or silenced.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      maui_ohos_ref:
        description: 'maui-ohos commit SHA to compile (defaults to the pinned feature/openharmony tip)'
        required: false
        type: string
        default: 'bb6b06990d0583f429620545375c8d2d9f8d6709'

# Least privilege: the job only reads this repository and the public springmin/maui-ohos fork;
# no step pushes anywhere.
permissions:
  contents: read

# Reproducible cross-repo compile: the MAUI slice is checked out at an exact commit, not the
# mutable feature/openharmony branch, so a push to the fork cannot change what this gate compiles.
# The default is the MULTIWINDOW-L2 merged slice tip: bb6b06990d (the L2-a per-window a11y
# provider + the L2-b child ArkWeb second host merged with SEC-SCAN-6 A/B and the C close hook;
# managed + shell source pins, so the rasterizer output does not move and the interaction harness
# moves to 688/690 floor 670; merged into feature/openharmony as bb6b06990d) on 23d98a9615 (M4: per-window focus/suspend,
# child-tagged IME/key/Back and a11y/alert partition, pinch routing, and SEC-SCAN-5c's
# primary-window text gate; managed + shell source pins, so the rasterizer output does not move and
# the interaction harness moves to 661/663 floor 643; merged into feature/openharmony as
# 74e0bde5b9) on 1a15f56b30 (MULTIWINDOW-L M2: the slice's app host
# is windowed - per-window surface/renderer state and the window-id routing entries
# RouteSurface/RouteTouch/RouteFrame; managed-only, the rasterizer output does not move and the
# interaction harness moves to 629/631 floor 611 - the 22 dual-window checks driven through this
# repository's window-id tagged hosting bridge), on top of b093e33825 (MULTIWINDOW-M: the in-app subwindow
# bridge is shell/host/managed - the shell's Index.ets subwindow controller and named-route
# SubWindow page, the host's ohos_host_sub_window_command / ohos_host_sub_window_event_listener
# exports and the slice's OpenHarmonySubWindow command/event state machine; SEC-SCAN-4 5f3efd55e5
# masks password Entry text in the accessibility shadow tree; the rasterizer output does not move
# and the interaction harness moved to 607/609 floor 589), on top of ed02203bfd (MULTIWINDOW-S: the
# managed app host arranges on a live surface Changed and keeps the last frame on Destroyed/0x0 -
# managed-only, the rasterizer output does not move and the interaction harness moves to 599/601
# floor 581), on top of d5384d6cc3 (FIX-A11YFLYOUT: the FlyoutPage
# accessibility walk publishes the Detail pane always and the presented Flyout only, mirroring the
# compositor's ChildEnumerator; managed-only, the rasterizer output does not move and the
# interaction harness moves to 593/595 floor 575), on top of 6652017ca5 (INTERP-DRAW2: the
# off-surface cull and the DrawCostTick/DrawKind* seam are managed-only; the rasterizer output did
# not move and the interaction harness moved to 591/593 floor 573), on top of 189b87ca8a (AUTODISCONNECT: a web
# control that leaves the layout drops its overlay claim and its dynamic slot is destroyed; a
# re-added one re-claims and replays - managed-only, the rasterizer expectations did not move and
# the interaction harness moved to 587/589 floor 569), on top of 7c731a7ca3 (INTERP-RENDER: the
# layout gate and its invalidation-version signal are managed-only; the rasterizer output does
# not move and the harness stays at 584/586), on top of 3feb347414 (SLOTS-DYNAMIC: the shell's
# overlay-capacity event is routed into the managed pool and the pool creates/destroys dynamic
# ArkWeb slots on demand; managed/shell-only, the rasterizer expectations do not move and the
# interaction harness now pins 584/586), on top of 549967f2f0 (FIX-SLICERACE: a re-entrant connect
# lock serializes Connect/ConnectTree against the shell-thread surface/frame callbacks and the
# app host serializes every tree-touching entry behind a ready latch; L6 96034e2acf adds the
# Jpeg screenshot format/quality host export and the Window.Title foreground heartbeat;
# SAMPLE-FIX 1926cf68b6 accepts the pack-staged HybridWebView bootstrap script; LEGACY
# 7064bb8c1c mirrors the Core Toolbar icons/order/priority and draws/hit-tests the shell bar),
# on top of 07423dfe93 (MULTI-OVERLAY-FULL: LRU overlay-slot
# reuse behind the IOpenHarmonyOverlaySlotOwner preempt/restore contract, per-slot hybrid
# channels and slot-tagged invoke ids, activation-ordered z-order and the payload-in-libs appDir
# probe; MULTI-OVL 75c410e798 below adds one ArkWeb overlay slot per web handler), on top of
# 15d81f31b1 (FIX-JSCALL: root the BlazorWebView IPC's
# JSCallResultType/JSCallType/NavigationOptions value types in OpenHarmonySliceJsonContext so the
# package's reflection-only IpcCommon serialize path keeps the resolver-built EnumConverter
# instantiations in the AOT image, and drop the stub-interop click probe), on top of 52b082a071
# (FIX-BWVMount: mount the BlazorWebView page under NativeAOT - the handler's static constructor
# touches the source-generated JsonElement[] type info so the package's reflection-only
# ArrayConverter stays in the AOT image, plus start/connect diagnostics and a message-time
# BLZ_DIAG probe), on top of be09a48817
# (FIX-BACKSIZE: the system Back press from the shell/host bridge closes a presented drawer -
# the flyout/shell handlers subscribe to OpenHarmonyBridge.BackPressed and write
# IsPresented/FlyoutIsPresented, otherwise report unhandled - and the BlazorWebView handler
# reports a real desired size (width = the constraint, height = min(400, the constraint) or the
# explicit HeightRequest; no frame while a hybrid overlay is registered)), on top of 47d79add01
# (FIX-WVP: the ArkWeb overlay converts
# the element frame from device pixels to vp, keeps the hybrid registration when a later Blazor
# load follows, draws above the managed surface and suspends under a presented drawer/tab
# switch), on top of 86b439ffc8 (FIX-DISMISS: the flyout page's default layout behavior is
# stated as Popover at connect, so an outside tap dismisses it under the device's landscape +
# non-phone display conditions), on top of 68ec598037 (FIX-HOME: the NavigationPage
# handler descends its arrange into its current page - the Hello Home tab's content subtree
# draws), on top of eec30c01cd, the W9 consolidation on top of the
# rc.2 slice re-anchor ebffdd787c (dotnet/maui release/11.0.1xx-rc2 349017b7 + the OpenHarmony
# delta, Microsoft.Maui.* 11.0.0-rc.2.26478.12): W9B T14 flyout leftovers + T21 font-scale
# wiring, W9C T8 uneven TableView rows, W9D T20 media bridge and W9A B2 staged-WASM WebView.
# The rc.2 tree carries the N6 window decoration mapping and its
# four caption-glyph pixel checks, T15's three rich-title-view checks and the T16/N4/N5/T18
# slices below), the N5 overlay touch passthrough suppression 163e7554, the T18 Essentials IMap system-map
# launcher b386b1c4, the N4 TitleBar row in the accessibility shadow tree 43996268, the T16
# structured menus 038449e8 and the T15 rich Shell.TitleView in the title bar 5a24b0c5, on top of
# the FIX-SHELL Shell CurrentPage enumeration in
# the compositor/a11y walks a4c4bea933, the T14 rich shell flyout d8e144a8, the T12
# CarouselView group header/footer slides 9ab879ff, the A11Y-TABBED TabbedPage CurrentPage fix in
# the accessibility walk dc9b19a6, the N3 Picker/DatePicker/TimePicker IsOpen mapping 3b88f5f3,
# the T21 system font scale 51cb186c (which also extends this pixel suite with its three scale
# checks), the T13 CollectionView GroupFooter view templates 5dbd7713 and the FIX-TABBED
# TabbedPage CurrentPage in the compositor walk 14bdb85f, on top of the T6 flow-direction (RTL)
# mirroring for
# placement, drawing and hit-testing, the T8 TableView on the shared list pipeline 12a1971b and
# the N2 empty-ContentPage placement fix f96d484b, on top of the T7 DatePicker month calendar
# 843a6c7c, the T11 diagnostics overlay and its adorners 89e41efa and the T9 window title
# bar 05935db3, on top of the T3 GraphicsView merge b6a58645, the T5 layout semantics c1c05f3d,
# the T4 Label spans, the T10 modal accessibility overlay and the T1 InputView mapping dcc7eaac
# + T2 WebView CookieContainer sync 8241f1b3, on top of the W-series webview wiring d6325990 and
# the SEC-SCAN-3 S3-DL3 dot-dot deep-link rejection, on top of the P2c deep-link routing, P2b-IMG,
# P1b-LIST and P1a-ANIM batches).
# The interaction harness pins 688 checks / total 690 / floor 670; advance the pin in lockstep
# with the interaction gate and change it deliberately (workflow_dispatch can compile any other
# commit SHA).
env:
  MAUI_OHOS_REF: ${{ github.event.inputs.maui_ohos_ref || 'bb6b06990d0583f429620545375c8d2d9f8d6709' }}
  # Same as the interaction gate: keep the setup-dotnet preview SDK in a cacheable per-user path
  # instead of the runner's /usr/share/dotnet; a newer 11.0.x preview is still downloaded (the
  # action re-resolves the channel), the cache only skips the ~200 MB download when it moved.
  DOTNET_INSTALL_DIR: ~/.dotnet

jobs:
  pixel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workload (this repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the maui-ohos slice sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: springmin/maui-ohos
          ref: ${{ env.MAUI_OHOS_REF }}
          path: maui-ohos
          fetch-depth: 1
          persist-credentials: false
      - name: Cache the .NET SDK and the NuGet global packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.dotnet
            ~/.nuget/packages
          key: dotnet-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            dotnet-${{ runner.os }}-${{ github.workflow }}-
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - name: Add the dnceng dotnet11 feed (MAUI rc.2 daily packages)
        # The pinned slice carries Microsoft.Maui.* 11.0.0-rc.2.26478.12, a dnceng dotnet11
        # daily that is not on nuget.org yet (see docs/rc2-line-notes.md). Drop this step
        # when the official rc.2 packages ship and the slice pins move to nuget.org versions.
        run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json --name dnceng-dotnet11
      - name: Reject machine-specific absolute paths in build inputs
        run: sh scripts/check-no-absolute-paths.sh
      # One run only: the previous workflow ran the suite twice (once for the exit code, once for
      # the marker) with `|| true` on the second, which doubled the suite time for no coverage.
      - name: Run the headless pixel suite (single run)
        working-directory: test/headless-render
        env:
          MAUI_SLICE_DIR: ${{ github.workspace }}/maui-ohos/src/Core/src/Platform/OpenHarmony
        run: |
          set -euo pipefail
          dotnet run -c Release | tee result.txt
          grep -q "PIXEL ASSERTIONS PASSED" result.txt
